<style>
@font-face{font-family:"Hanken";src:url(assets/hanken-variable.woff2) format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"JBMono";src:url(assets/jb-mono-variable.woff2) format("woff2");font-weight:100 800;font-display:block}

/* ---------- Scale system: reference px of a 1280-wide canvas (hero) ---------- */
:root{
  --u:min(calc(100vw / 1280),calc(100vh / 640));
  --u:min(calc(100vw / 1280),calc(100svh / 640));
  --frame-w:calc(1280 * var(--u));
  --frame-x:calc(50% - 640 * var(--u));
  --cu:var(--u);--hb:var(--u);--tb:var(--u);--nu:var(--u);
  --layout:desktop;
  --logo-ratio:0.25;                         /* set from config.js (logo height / width) */
  --strip-ref:1000;--strip-scale:1;
  --strip-top:calc(120 * var(--u));
  --strip-w:calc(var(--strip-ref) * var(--u) * var(--strip-scale));
  --strip-bot:calc(12 * var(--u));
  --accent:#E3120B;--ink:#fff;--nav:#c2c2c2;--line:#262626;--dim:#8f8f8f;
  --ph:linear-gradient(160deg,color-mix(in srgb,var(--accent) 55%,#000),#0b0b0b);   /* shown where a photo is missing */
  --expo:cubic-bezier(0.16,1,0.3,1);--ease-out:cubic-bezier(0.23,1,0.32,1);
  --gutter:clamp(16px,4vw,48px);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{background:#000;overscroll-behavior:none}
body{background:#000;overflow-x:hidden;font-family:"Hanken",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:geometricPrecision}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:2px}
[id]{scroll-margin-top:72px}

/* ======================================================================
   HERO
   ====================================================================== */
.stage{position:relative;width:100%;height:100vh;height:100svh;overflow:hidden;background:#000;isolation:isolate}
.stage.no-photo{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent) 38%,color-mix(in srgb,var(--accent) 30%,#000))}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;z-index:0;user-select:none;-webkit-user-drag:none;pointer-events:none}
.photo.is-placed{inset:auto;object-fit:fill;max-width:none}
/* a still photo stands in for video: a slow breath of scale keeps it alive */
.photo.is-placed{animation:breathe 16s ease-in-out infinite alternate;transform-origin:var(--fx,50%) var(--fy,25%)}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.04)}}
.lift{position:absolute;left:0;right:0;top:0;height:var(--band-h,calc(380 * var(--u)));z-index:1;pointer-events:none;background:color-mix(in srgb,var(--accent) 20%,transparent);mix-blend-mode:screen}
.shade{position:absolute;left:0;right:0;bottom:0;height:40%;z-index:1;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,0))}

.band{position:absolute;left:0;right:0;top:0;z-index:2;display:grid;
  grid-template-columns:1fr var(--strip-w) 1fr;
  grid-template-rows:var(--strip-top) calc(var(--strip-w) * var(--logo-ratio)) var(--strip-bot)}
.band>span{background:#000}
.band .band-top,.band .band-bot{grid-column:1/-1}
.band h1{grid-column:2;grid-row:2;position:relative;font-size:0;line-height:0}
.band svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:block}
.fit-text{font-family:"Hanken","Arial Black",Arial,sans-serif;font-weight:900;font-size:100px}

.nav{position:absolute;top:0;left:max(var(--frame-x),0px);width:min(var(--frame-w),100%);height:calc(100 * var(--u));z-index:4}
.nav .col{position:absolute;top:calc(10.5 * var(--u));font-weight:250;font-size:calc(14.286 * var(--nu));line-height:calc(18 * var(--nu));white-space:nowrap;color:var(--nav)}
.nav .col:nth-child(1){left:max(calc(7 * var(--u)),22px)}
.nav .col:nth-child(2){left:calc(117 * var(--u))}
.nav .col:nth-child(3){left:calc(227 * var(--u))}
.nav .col a{display:inline-block;letter-spacing:calc(-1.1 * var(--nu));transition:opacity .15s}
.nav .col a:hover{opacity:.6}
.tagline{position:absolute;left:0;right:0;top:calc(11.357 * var(--u));text-align:center;pointer-events:none;font-weight:250;font-size:calc(14.286 * var(--nu));line-height:calc(14.286 * var(--nu));letter-spacing:calc(-1.2 * var(--nu));word-spacing:calc(3.44 * var(--nu));white-space:nowrap;color:var(--nav)}
.cta{position:absolute;right:calc(13 * var(--u));top:calc(9.5 * var(--u));height:calc(28.5 * var(--cu));display:inline-flex;align-items:center;gap:calc(6 * var(--cu));padding:0 calc(12 * var(--cu)) 0 calc(10 * var(--cu));background:var(--accent);color:var(--ink);border-radius:calc(2 * var(--cu));white-space:nowrap;transition:filter .15s,transform .16s var(--ease-out)}
.cta:hover{filter:brightness(1.1)}
.cta:active{transform:scale(.97)}
.cta svg{width:calc(10 * var(--cu));height:calc(10 * var(--cu));flex:none}
.cta span{font-weight:280;font-size:calc(14.286 * var(--cu));line-height:1.1;letter-spacing:calc(-1.042 * var(--cu));word-spacing:calc(3.2 * var(--cu));overflow:hidden;text-overflow:ellipsis}
.menu-btn{display:none}
.nav-links{display:contents}

.copy{position:absolute;left:var(--frame-x);width:var(--frame-w);bottom:0;height:calc(100 * var(--u));z-index:3;display:flex;flex-direction:column;align-items:center;padding-top:calc(21.715 * var(--u));gap:calc(15.7 * var(--hb))}
.headline{font-weight:290;font-size:calc(28.571 * var(--hb));line-height:calc(28.571 * var(--hb));letter-spacing:calc(-0.896 * var(--hb));word-spacing:calc(5.62 * var(--hb));white-space:nowrap;text-transform:uppercase}
.next{position:relative;display:flex;align-items:center;gap:calc(8 * var(--tb));height:calc(19 * var(--tb));white-space:nowrap}
.next svg{width:calc(9 * var(--tb));height:calc(9 * var(--tb));flex:none}
.dot{fill:var(--accent)}
.pulse{transform-origin:center;transform-box:fill-box;animation:pulse 2.4s var(--ease-out) infinite}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}80%,100%{opacity:0;transform:scale(2.2)}}
.next-word{font-weight:500;font-size:calc(12.286 * var(--tb));line-height:1;letter-spacing:calc(-0.149 * var(--tb));color:#fff}
.next-meta{font-family:"JBMono",ui-monospace,Menlo,monospace;font-weight:400;font-size:calc(11.37 * var(--tb));line-height:1;letter-spacing:calc(-0.268 * var(--tb));color:#FFFEF7;opacity:.85}
.next:hover .next-word{text-decoration:underline;text-underline-offset:3px}
.next-row{display:flex;align-items:center;gap:calc(12 * var(--tb))}
.next-tix{position:relative;display:inline-flex;align-items:center;gap:calc(6 * var(--tb));height:calc(22 * var(--tb));padding:0 calc(9 * var(--tb)) 0 calc(10 * var(--tb));background:var(--accent);color:var(--ink);border-radius:2px;font-weight:500;font-size:calc(11.5 * var(--tb));letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;transition:filter .2s ease,transform .16s var(--ease-out)}
.next-tix svg{width:calc(8 * var(--tb));height:calc(8 * var(--tb));transition:transform .2s var(--ease-out)}
.next-tix::after{content:"";position:absolute;inset:-10px -6px}
.next-tix:active{transform:scale(.96)}
@media (hover:hover) and (pointer:fine){.next-tix:hover{filter:drop-shadow(0 0 12px color-mix(in srgb,var(--accent) 70%,transparent)) brightness(1.08)}.next-tix:hover svg{transform:translate(1px,-1px)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.lid{opacity:0;transform-box:fill-box;transform-origin:50% 0}
.is-entering .lid{opacity:1}
.is-entering :is(.nav .col,.menu-btn,.tagline,.cta,.headline,.next,.next-tix){opacity:0}

/* ======================================================================
   DOCK: a slim bar that takes over the nav once the hero is gone
   ====================================================================== */
.dock{position:fixed;top:0;left:0;right:0;z-index:20;height:56px;display:flex;align-items:center;gap:24px;padding:0 var(--gutter);background:rgba(0,0,0,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  transform:translateY(-100%);visibility:hidden;transition:transform .24s var(--ease-out),visibility 0s linear .24s}
.dock.is-shown{transform:none;visibility:visible;transition:transform .24s var(--ease-out)}
.dock-logo{height:22px;width:auto;flex:none}
.dock-logo.is-dark{filter:invert(1)}
.dock-name{font-weight:900;font-size:19px;letter-spacing:-0.03em;text-transform:uppercase}
.dock ul{display:flex;gap:22px;margin-left:auto;font-weight:250;font-size:14.286px;letter-spacing:-1.1px;color:var(--nav)}
.dock ul a{transition:opacity .15s}
.dock ul a:hover{opacity:.6}
.dock ul a[aria-current="true"]{color:#fff}
.pill{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 14px 0 11px;background:var(--accent);color:var(--ink);border-radius:2px;font-weight:280;font-size:14.286px;letter-spacing:-1.042px;word-spacing:3.2px;white-space:nowrap;border:0;cursor:pointer;transition:filter .15s,transform .16s var(--ease-out)}
.pill svg{width:10px;height:10px;flex:none}
.pill:hover{filter:brightness(1.1)}
.pill:active{transform:scale(.97)}
.dock .pill{flex:none}

/* ======================================================================
   SECTIONS
   ====================================================================== */
.section{position:relative;padding:clamp(88px,12vw,168px) var(--gutter) 0;max-width:1520px;margin:0 auto}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:clamp(28px,4vw,48px);border-bottom:1px solid var(--line)}
/* the --h2-* variables come from SITE.titleFont in config.js; without it the titles use the body font, thin */
.h2{font-family:var(--h2-font,inherit);font-weight:var(--h2-weight,250);font-style:var(--h2-style,normal);font-stretch:var(--h2-stretch,normal);font-size:calc(clamp(64px,12.5vw,184px) * var(--h2-size,1));line-height:var(--h2-lh,.86);letter-spacing:var(--h2-track,-0.055em);text-transform:var(--h2-case,uppercase);overflow:hidden;padding:0 .08em var(--h2-pad,.04em) 0}
/* font trial switcher: only shown while SITE.fontTrial lists options */
.trial{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;display:flex;gap:4px;padding:4px;max-width:calc(100vw - 24px);overflow-x:auto;background:rgba(20,20,20,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:4px}
.trial button{height:32px;padding:0 12px;border:0;border-radius:2px;background:transparent;color:var(--nav);font-size:13.5px;white-space:nowrap;cursor:pointer;transition:transform .16s var(--ease-out)}
.trial button:active{transform:scale(.97)}
.trial button[aria-pressed="true"]{background:#fff;color:#000}
.h2>span{display:block}
.h2{max-width:100%;font-size:min(calc(clamp(64px,12.5vw,184px) * var(--h2-size,1)),calc((100vw - 2 * var(--gutter)) / 7.2))}
.section-note{max-width:34ch;padding-bottom:.6em;font-size:15px;line-height:1.45;color:var(--dim);text-align:right}
.mono{font-family:"JBMono",ui-monospace,Menlo,monospace;font-weight:400;letter-spacing:-0.02em}
.ph{position:relative;overflow:hidden;background:var(--ph)}
.ph img{width:100%;height:100%;object-fit:cover}

/* ---------- Bio ---------- */
.bio{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(24px,5vw,80px);padding-top:clamp(32px,5vw,64px);align-items:start}
.bio-photo{aspect-ratio:4/5}
.bio-photo img{object-position:50% 30%}
.bio-text{display:flex;flex-direction:column;gap:22px;max-width:56ch;padding-top:clamp(0px,2vw,24px)}
.lede{font-weight:290;font-size:clamp(24px,2.6vw,36px);line-height:1.15;letter-spacing:-0.03em;text-transform:uppercase}
.bio-text p:not(.lede){font-weight:350;font-size:18px;line-height:1.6;color:#d6d6d6}
.bio-clip{display:flex;flex-direction:column;gap:22px;overflow:hidden;transition:height .55s var(--expo)}
.bio-text.is-clamped .bio-clip{-webkit-mask-image:linear-gradient(#000 calc(100% - 88px),transparent);mask-image:linear-gradient(#000 calc(100% - 88px),transparent)}
.bio-more{align-self:flex-start;background:transparent;color:#fff;box-shadow:inset 0 0 0 1px #555;font-weight:400;letter-spacing:-0.6px;transition:box-shadow .15s ease,background-color .15s ease,transform .16s var(--ease-out)}
.bio-more:hover{box-shadow:inset 0 0 0 1px #fff;filter:none}
.bio-more svg{transition:transform .3s var(--ease-out)}
.bio-more[aria-expanded="true"] svg{transform:rotate(180deg)}
.bio-more[hidden]{display:none}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:14px;padding-top:22px;border-top:1px solid var(--line)}
.facts dt{font-size:13px;color:var(--dim)}
.facts dd{margin-top:6px;font-weight:290;font-size:20px;letter-spacing:-0.03em;text-transform:uppercase}

.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,1.2vw,16px);margin-top:clamp(56px,8vw,112px)}
.gallery figure{aspect-ratio:2/3}


/* ---------- Fechas ---------- */
.dates-wrap{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:clamp(24px,5vw,80px);align-items:start}
.dates li{border-bottom:1px solid var(--line)}
.date{display:grid;grid-template-columns:120px minmax(0,1fr) auto;align-items:start;gap:8px 24px;padding:26px 0}
.date .status-cell{padding-top:4px}
.date time{font-size:14px;line-height:1.35;color:var(--nav)}
.date time b{display:block;font-family:"Hanken",sans-serif;font-weight:290;font-size:30px;letter-spacing:-0.04em;color:#fff}
.d-city{font-weight:290;font-size:clamp(26px,3.3vw,44px);line-height:1;letter-spacing:-0.045em;text-transform:uppercase;transition:color .2s ease}
.d-venue{display:block;margin-top:8px;font-size:15px;color:var(--dim)}
.d-venue.is-tba{display:flex;width:max-content;height:24px;margin-top:12px;align-items:center;justify-content:center;gap:8px;padding:1px 10px 0;line-height:1;border:1px dashed #4a4a4a;border-radius:2px;font-family:"JBMono",ui-monospace,Menlo,monospace;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.d-lineup{display:flex;flex-wrap:wrap;align-items:center;gap:6px 0;margin-top:14px;font-family:"JBMono",ui-monospace,Menlo,monospace;font-size:12.5px;letter-spacing:-0.01em;text-transform:uppercase;color:#cfcfcf}
.d-lineup b{margin-right:12px;padding:3px 7px 2px;border:1px solid #3a3a3a;border-radius:2px;font-weight:400;font-size:10.5px;letter-spacing:.06em;color:var(--dim)}
.d-lineup span:not(:last-child)::after{content:"/";margin:0 9px;color:#555;text-shadow:none}
.d-lineup .is-me{color:#fff;text-shadow:0 0 12px color-mix(in srgb,var(--accent) 80%,transparent)}
.d-lineup .is-me::before{content:"";display:inline-block;width:5px;height:5px;margin:0 7px 2px 0;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);vertical-align:middle}
.d-lineup+.d-lineup{margin-top:8px}
.is-past .d-lineup{margin-top:10px;font-size:11.5px;color:var(--dim)}
.is-past .d-lineup .is-me{color:var(--nav);text-shadow:none}
/* past shows: a quiet link to the event page */
.past-link{position:relative;display:inline-flex;align-items:center;gap:6px;font-family:"JBMono",ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.02em;color:var(--dim);text-decoration:underline;text-decoration-color:transparent;text-underline-offset:4px;transition:color .2s ease,text-decoration-color .2s ease}
.past-link svg{width:8px;height:8px;transition:transform .2s var(--ease-out)}
.past-link::after{content:"";position:absolute;inset:-12px -10px}
@media (hover:hover) and (pointer:fine){.past-link:hover{color:#fff;text-decoration-color:currentColor}.past-link:hover svg{transform:translate(1px,-1px)}}
.past-link:focus-visible{outline:2px solid #fff;outline-offset:3px}
.status{display:inline-flex;align-items:center;height:30px;padding:0 14px;border:1px solid #555;border-radius:2px;font-weight:280;font-size:14px;letter-spacing:-0.6px;white-space:nowrap;transition:background-color .15s ease,border-color .15s ease,filter .15s ease,transform .16s var(--ease-out)}
a.status:hover{background:#fff;border-color:#fff;color:#000}
a.status:active{transform:scale(.97)}
.status.is-hot{background:var(--accent);border-color:var(--accent);color:var(--ink)}
a.status.is-hot:hover{background:var(--accent);border-color:var(--accent);color:var(--ink);filter:brightness(1.12)}
.status.is-off{border-color:transparent;color:#6b6b6b;text-decoration:line-through}
.status.is-soon{border-color:transparent;color:var(--nav);padding:0}
/* ticket stub: red pass with a perforation and the selling platform */
.ticket{display:inline-flex;align-items:stretch;height:40px;color:var(--ink);font-weight:500;font-size:13.5px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;filter:drop-shadow(0 0 0 transparent);transition:transform .16s var(--ease-out),filter .3s ease}
.ticket>span{display:inline-flex;align-items:center;gap:9px;background:var(--accent);
  -webkit-mask:radial-gradient(circle 5px at var(--nx) 0,#0000 97%,#000) top/100% 51% no-repeat,radial-gradient(circle 5px at var(--nx) 100%,#0000 97%,#000) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle 5px at var(--nx) 0,#0000 97%,#000) top/100% 51% no-repeat,radial-gradient(circle 5px at var(--nx) 100%,#0000 97%,#000) bottom/100% 51% no-repeat}
.t-main{--nx:100%;padding:0 16px 0 15px;border-radius:3px 0 0 3px}
.t-src{--nx:0;padding:0 13px 0 14px;border-left:1.5px dashed rgba(255,255,255,.5);border-radius:0 3px 3px 0;font-family:"JBMono",ui-monospace,Menlo,monospace;font-weight:400;font-size:12px;letter-spacing:-0.02em;text-transform:none}
.t-dot{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;animation:tdot 1.8s ease-in-out infinite}
@keyframes tdot{50%{opacity:.3}}
.t-arrow{width:9px;height:9px;flex:none;transition:transform .2s var(--ease-out)}
.ticket.is-hot .t-main{background:#fff;color:#000}
@media (hover:hover) and (pointer:fine){
  .ticket:hover{filter:drop-shadow(0 0 16px color-mix(in srgb,var(--accent) 65%,transparent)) brightness(1.08)}
  .ticket:hover .t-arrow{transform:translate(2px,-2px)}
}
.ticket:active{transform:scale(.97)}
.ticket:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media (hover:hover) and (pointer:fine){.date:hover .d-city{color:var(--accent)}}
.dates-photo{position:sticky;top:88px;aspect-ratio:2/3;margin-top:0}
.dates-foot{margin-top:28px;font-size:15px;color:var(--dim)}
.sub{margin-top:clamp(56px,7vw,96px);padding-bottom:18px;border-bottom:1px solid var(--line);font-weight:290;font-size:clamp(22px,2.4vw,32px);letter-spacing:-0.04em;text-transform:uppercase}
.is-past .date{padding:18px 0}
.is-past .date time b{font-size:20px;color:var(--nav)}
.is-past .d-city{font-size:clamp(20px,2.2vw,28px);color:var(--nav)}
.is-past .d-venue{margin-top:6px}
/* recent shows: the latest one in focus, the next one blurred behind it; the button opens them all */
.recent-clip{position:relative;overflow:hidden;transition:height .6s var(--expo)}
.recent-clip .dates>li+li{filter:blur(5px);opacity:.5;transition:filter .5s ease,opacity .5s ease}
.recent:not(.is-open) .recent-clip.has-more{-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.recent:not(.is-open) .recent-clip .dates>li+li{cursor:pointer}
.recent.is-open .recent-clip .dates>li+li{filter:none;opacity:1}
.recent-more{margin-top:18px}
.recent-more[aria-expanded="true"] svg{transform:rotate(180deg)}
.dates-foot a{color:#fff;text-decoration:underline;text-underline-offset:4px}

/* ---------- Sets ---------- */
.sets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.6vw,24px);padding-top:clamp(32px,5vw,64px)}
.set{display:flex;flex-direction:column;gap:14px}
.set-cover{aspect-ratio:4/5}
.sets.is-square .set-cover{aspect-ratio:1/1}   /* sets.square: platform artwork, never cropped */
.set-cover img{transition:transform .7s var(--expo)}
.set-cover iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.play{position:absolute;left:14px;bottom:14px;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--ink);border:0;cursor:pointer;transition:transform .16s var(--ease-out),filter .15s}
.play svg{width:16px;height:16px;margin-left:3px}
.play:hover{filter:brightness(1.1)}
.play.is-out{width:auto;height:44px;padding:0 14px 0 12px;border-radius:22px;gap:8px;display:inline-flex;font-size:14px;font-weight:500;letter-spacing:-0.01em;background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.play.is-out .ico{width:18px;height:18px}
.play.is-out .arr{width:11px;height:11px;margin:0}
.play.is-out:hover{background:var(--accent);filter:none}
/* the cover clips its edges for the reveal, so the play button's focus ring is drawn inside it */
.play:focus-visible{outline:2px solid #fff;outline-offset:-5px}
.skip{position:fixed;left:16px;top:-60px;z-index:50;padding:12px 16px;background:#fff;color:#000;border-radius:2px;font-weight:500;transition:top .16s var(--ease-out)}
.skip:focus{top:12px}
.play:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){.set:hover .set-cover img{transform:scale(1.04)}}
.set h3{font-weight:500;font-size:17px;letter-spacing:-0.02em}
.set-meta{font-size:12.5px;color:var(--dim)}
.platforms{display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px;margin-top:clamp(40px,5vw,64px);padding-top:24px;border-top:1px solid var(--line);font-size:15px;color:var(--dim)}
.platforms a{color:#fff;font-weight:290;font-size:clamp(22px,2.4vw,32px);letter-spacing:-0.04em;text-transform:uppercase;transition:color .2s ease}
.platforms a:hover{color:var(--accent)}
.ico{width:1em;height:1em;flex:none}
.platforms a,.contact ul a{display:inline-flex;align-items:center;gap:.45em}
.platforms .ico{width:.82em;height:.82em}
.contact ul li{margin-top:12px}
.contact ul .ico{width:1.05em;height:1.05em}

/* ---------- Booking ---------- */
.booking{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(24px,5vw,80px);padding-top:clamp(32px,5vw,64px);align-items:start}
.booking-photo{aspect-ratio:4/5}
.booking-photo img{object-position:50% 25%}
.booking-intro{max-width:52ch;font-weight:350;font-size:18px;line-height:1.6;color:#d6d6d6}
.booking-intro a{color:#fff;text-decoration:underline;text-underline-offset:4px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 24px;margin-top:36px}
.field{display:flex;flex-direction:column;gap:8px}
.field.is-wide{grid-column:1/-1}
.field label{font-size:14px;color:var(--dim)}
.field input,.field select,.field textarea{width:100%;min-height:46px;padding:10px 0;background:transparent;border:0;border-bottom:1px solid #3a3a3a;border-radius:0;font-size:18px;font-weight:350;outline:none;transition:border-color .15s ease}
.field textarea{min-height:110px;resize:vertical;line-height:1.5}
.field select{appearance:none;-webkit-appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,#c2c2c2 50%),linear-gradient(135deg,#c2c2c2 50%,transparent 50%);background-position:calc(100% - 12px) 21px,calc(100% - 7px) 21px;background-size:5px 5px;background-repeat:no-repeat}
.field select option{background:#111;color:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-bottom-color:var(--accent)}
.field input[type="date"]{color-scheme:dark}
.form-foot{grid-column:1/-1;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.form-foot .pill{height:44px;padding:0 20px 0 16px;font-size:15.5px}
.form-status{font-size:15px;color:var(--nav)}

/* ---------- language switch ---------- */
.nav-end{position:absolute;right:max(calc(13 * var(--u)),22px);top:calc(9.5 * var(--u));display:flex;align-items:center;gap:calc(10 * var(--cu))}
.nav-end .cta{position:relative;right:auto;top:auto}
.lang{display:inline-flex;align-items:center;height:calc(28.5 * var(--cu));padding:calc(2 * var(--cu));border:1px solid rgba(255,255,255,.28);border-radius:calc(2 * var(--cu));background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.lang a{display:inline-flex;align-items:center;justify-content:center;height:100%;min-width:calc(30 * var(--cu));padding:0 calc(7 * var(--cu));border-radius:calc(1 * var(--cu));font-family:"JBMono",ui-monospace,Menlo,monospace;font-size:calc(11.5 * var(--cu));letter-spacing:.04em;color:rgba(255,255,255,.62);transition:color .15s ease,background-color .2s ease}
.lang a:hover{color:#fff}
.lang a[aria-current="true"]{background:#fff;color:#000}
.lang a:active{transform:scale(.96)}
.dock .lang{flex:none;height:32px;padding:2px;border-radius:2px;margin-left:4px}
.dock .lang a{min-width:34px;padding:0 8px;font-size:12px;border-radius:1px}
.is-entering .nav-end .lang{opacity:0}
/* ---------- Contacto ---------- */
.news{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:24px clamp(24px,5vw,80px);align-items:end;margin-top:clamp(32px,5vw,64px);padding:clamp(28px,4vw,48px);background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 22%,#000) 0%,#0b0b0b 62%);border:1px solid color-mix(in srgb,var(--accent) 35%,#222);border-radius:3px;position:relative;overflow:hidden}
.news::after{content:"";position:absolute;inset:auto -10% -60% auto;width:55%;aspect-ratio:1;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 38%,transparent),transparent);pointer-events:none}
.news>*{position:relative;z-index:1}
.news-tag{display:inline-flex;align-items:center;gap:8px;font-family:"JBMono",ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#fff}
.news-tag i{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:tdot 1.8s ease-in-out infinite}
.news h3{margin-top:14px;font-family:var(--h2-font,inherit);font-weight:var(--h2-weight,700);font-stretch:var(--h2-stretch,normal);font-size:clamp(30px,3.6vw,52px);line-height:.92;letter-spacing:-0.04em;text-transform:uppercase;color:#fff}
.news-text{margin-top:14px;max-width:40ch;font-weight:350;font-size:17px;line-height:1.5;color:#d6d6d6}
.news-form{display:flex;flex-direction:column;gap:16px}
.news-row{display:flex;align-items:stretch;border-bottom:1px solid #4a4a4a;transition:border-color .15s ease}
.news-row:focus-within{border-bottom-color:#fff}
.news-row input{flex:1;min-width:0;min-height:52px;padding:10px 0;background:transparent;border:0;outline:none;font-size:clamp(18px,1.6vw,22px);font-weight:350;color:#fff}
.news-row input::placeholder{color:#8a8a8a}
.news-row .pill{align-self:center;height:40px;padding:0 18px 0 15px;font-size:14.5px;font-weight:400;letter-spacing:-0.4px}
.news-ok{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45;color:var(--nav);cursor:pointer}
.news-ok input{flex:none;width:18px;height:18px;margin-top:1px;accent-color:var(--accent);cursor:pointer}
.news-status{min-height:1.4em;font-size:15px;color:#fff}
.news-status.is-bad{color:#ff8a80}
.news-hp{position:absolute!important;left:-9999px;width:1px;height:1px;overflow:hidden}
.news.is-done .news-form>*:not(.news-status){display:none}
.contact .contact-note{margin-top:8px;max-width:30ch;font-weight:350;font-size:14px;line-height:1.45;letter-spacing:0;color:var(--dim)}
.contact{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;padding-top:clamp(32px,5vw,64px)}
.news+.contact{padding-top:clamp(40px,5vw,64px)}
#booking.rv{scroll-margin-top:96px}
.contact h3{font-size:14px;font-weight:400;color:var(--dim)}
.contact p,.contact li{margin-top:10px;font-weight:290;font-size:clamp(20px,2vw,26px);letter-spacing:-0.035em;overflow-wrap:anywhere}
.contact ul li{margin-top:6px}
.contact a{transition:color .2s ease}
.contact a:hover{color:var(--accent)}
.foot-logo{display:block;width:100%;aspect-ratio:calc(1 / var(--logo-ratio));margin-top:clamp(72px,10vw,140px)}
.foot-logo svg{display:block;width:100%;height:100%;overflow:visible}
.foot-bar{display:flex;justify-content:space-between;gap:16px;padding:28px 0 calc(28px + env(safe-area-inset-bottom));margin-top:clamp(32px,4vw,56px);border-top:1px solid var(--line);font-size:12.5px;color:var(--dim)}
.foot-bar a:hover{color:#fff}

/* ---------- Scroll reveals: everything rises ---------- */
.can-reveal .rv{opacity:0;transform:translateY(8px);transition:opacity .7s var(--expo),transform .7s var(--expo);transition-delay:var(--d,0ms)}
.can-reveal .rv.is-in{opacity:1;transform:none}
.can-reveal .h2>span{transform:translateY(105%);transition:transform 1s var(--expo)}
.can-reveal .h2.is-in>span{transform:none}
.can-reveal .rv-img{clip-path:inset(0 0 100% 0);transition:clip-path 1.1s var(--expo);transition-delay:var(--d,0ms)}
.can-reveal .rv-img img{transform:scale(1.08)}
.can-reveal .rv-img.is-in{clip-path:inset(0 0 0 0)}
.can-reveal .rv-img.is-in img{transform:none;transition:transform 1.4s var(--expo) var(--d,0ms)}
.can-reveal .set .rv-img.is-in img{transition:transform .7s var(--expo)}
.can-reveal .is-now,.can-reveal .is-now img{transition:none!important}   /* reached by keyboard: shown at once */
.can-reveal .rv:focus-within,.can-reveal .rv-img:focus-within{opacity:1;transform:none;clip-path:none;transition:none}
.can-reveal .rv-img:focus-within img{transform:none;transition:none}

/* ======================================================================
   TABLET
   ====================================================================== */
@media (max-width:1074.98px),(max-height:537.98px){
  :root{
    --layout:tablet;
    --pad:clamp(20px,3.2vw,32px);
    --nu:1px;--cu:1px;--hb:1px;--tb:1px;
    --head-h:72px;
    --strip-top:var(--head-h);
    --strip-w:min(calc(100vw - 2 * var(--pad)),calc((100svh - var(--head-h)) * .4 / var(--logo-ratio)));
    --strip-bot:12px;
  }
  .nav{left:0;width:100%;height:var(--head-h);padding:0 var(--pad);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:16px}
  .menu-btn{display:inline-flex;justify-self:start;align-items:center;gap:10px;min-height:44px;background:none;border:0;color:var(--nav);font-family:inherit;font-weight:250;font-size:calc(14.286 * var(--nu));line-height:1;letter-spacing:calc(-1.252 * var(--nu));cursor:pointer;padding:0 8px 0 0;-webkit-tap-highlight-color:transparent}
  .menu-btn i{position:relative;display:block;width:18px;height:7px}
  .menu-btn i::before,.menu-btn i::after{content:"";position:absolute;left:0;right:0;height:1px;background:currentColor;transition:transform .22s ease}
  .menu-btn i::before{top:0}
  .menu-btn i::after{bottom:0}
  .nav.is-open .menu-btn i::before{transform:translateY(3px) rotate(45deg)}
  .nav.is-open .menu-btn i::after{transform:translateY(-3px) rotate(-45deg)}
  .tagline{position:static;justify-self:center}
  .cta{position:relative;right:auto;top:auto;grid-column:3;justify-self:end;min-width:0}
  .nav-end{position:relative;right:auto;top:auto;grid-column:3;justify-self:end;min-width:0;gap:10px}
  .lang{height:32px;padding:2px;border-radius:2px}
  .lang a{min-width:36px;padding:0 8px;font-size:12px;border-radius:1px}
  .dock .lang{margin-left:auto}
  .cta::after{content:"";position:absolute;inset:-8px -6px}
  .nav-links{display:grid;position:absolute;top:var(--head-h);left:0;right:0;z-index:5;grid-template-columns:repeat(3,max-content);column-gap:clamp(40px,7vw,88px);padding:0 var(--pad) 24px;background:#000;
    visibility:hidden;clip-path:inset(0 0 100% 0);transition:clip-path .26s cubic-bezier(.2,.7,.2,1),visibility 0s linear .26s}
  .nav.is-open .nav-links{visibility:visible;clip-path:inset(0);transition:clip-path .26s cubic-bezier(.2,.7,.2,1)}
  .nav .col{position:static}
  .nav .col a{padding:12px 0}
  .copy{left:0;width:100%;height:auto;padding:0 var(--pad);bottom:calc(15 * var(--tb) + env(safe-area-inset-bottom))}
  .headline{white-space:normal;text-align:center;text-wrap:balance;line-height:1.08}

  .dock ul{display:none}
  .dock .pill{margin-left:auto}
  .bio,.booking{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .news{grid-template-columns:minmax(0,1fr);align-items:start}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dates-wrap{grid-template-columns:minmax(0,1fr)}
  .dates-photo{position:relative;top:auto;order:-1;aspect-ratio:16/9;margin-top:32px}
  .dates-photo img{object-position:var(--band-pos,50% 20%)!important}   /* dates.photo.bandPos */
  .sets{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ======================================================================
   MOBILE
   ====================================================================== */
@media (max-width:559.98px){
  :root{
    --layout:mobile;
    --pad:clamp(14px,4.2vw,22px);
    --head-h:64px;
    --tag-row:30px;
    --hb:min(1.1px,calc((100vw - 2 * var(--pad)) / 300));
    --tb:min(1px,calc((100vw - 2 * var(--pad)) / 322));
    --strip-top:calc(var(--head-h) + var(--tag-row));
    --strip-w:calc(100vw - 2 * var(--pad));
    --strip-bot:10px;
  }
  :root.no-tagline{--tag-row:0px}
  .nav{height:auto;grid-template-columns:1fr auto;grid-template-rows:var(--head-h) var(--tag-row);column-gap:12px}
  .menu-btn{grid-column:1;grid-row:1}
  .cta{grid-column:2;grid-row:1;max-width:calc(100vw - 2 * var(--pad) - 96px)}
  .nav-end{grid-column:2;grid-row:1;max-width:calc(100vw - 2 * var(--pad) - 96px)}
  .nav-end .cta{max-width:none;min-width:0}
  .tagline{grid-column:1/-1;grid-row:2;align-self:start;justify-self:center;margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .nav-links{column-gap:clamp(12px,5vw,40px);padding-bottom:20px}
  .copy{bottom:calc(max(18px,env(safe-area-inset-bottom)) + 6px);gap:16px}
  .headline{max-width:calc(318 * var(--hb))}

  .section-head{flex-direction:column;align-items:flex-start;gap:14px}
  .section-note{text-align:left;padding-bottom:0}

  /* lineup: ['Artista', 'Otro', ...]; the artist of this site is lit up */

  var nx=up.filter(function(d){return d.status!=='soldout'})[0];

  /* ---------- sets ---------- */

  var where=function(u){ return /youtu/.test(u||'')?'YouTube':/spotify/.test(u||'')?'Spotify':/mixcloud/.test(u||'')?'Mixcloud':'SoundCloud'; };
  if(sets.square) $('sets-list').classList.add('is-square');
  $('sets-list').innerHTML=list.map(function(s,i){

  $('sets-list').addEventListener('click',function(e){
    var b=e.target.closest('.play'); if(!b) return; var s=list[+b.dataset.set];
    if(s.sc){ var f=document.createElement('iframe'); f.title=t('player',{t:s.title}); f.allow='autoplay';

      b.parentNode.appendChild(f); b.remove(); return; }
    var url=s.url||sc; if(url&&url!=='#') window.open(url,'_blank','noopener');
  });
  var pf=sets.platforms||[]; $('platforms').hidden=!pf.length;
  $('platforms').innerHTML='<span>'+esc(t('listenAt'))+'</span>'+pf.map(function(p){return '<a href="'+esc(p[1])+'" target="_blank" rel="noopener">'+icon(p[0])+esc(p[0])+'</a>'}).join('');

  /* ---------- booking + contact ---------- */
  if($('f-type')) $('f-type').innerHTML='<option value="" selected disabled>'+esc(t('choose'))+'</option>'+(booking.types||t('types')).map(function(x){return '<option>'+esc(x)+'</option>'}).join('');
  var mail=function(m){return '<p><a href="mailto:'+esc(m)+'">'+esc(m)+'</a></p>'};
  /* booking.section:false → no Booking section; booking lives in Contacto and #booking links land there */
  var inContact=booking.section===false;
  if(inContact){ var bs=$('booking'); bs.parentNode.removeChild(bs); document.querySelectorAll('.dock ul a[href="#booking"]').forEach(function(a){var li=a.parentNode; li.parentNode.removeChild(li)}); }
  $('contact').innerHTML=(booking.email?'<div class="rv"'+(inContact?' id="booking"':'')+'><h3>'+esc(t('booking'))+'</h3>'+mail(booking.email)+(inContact&&booking.note?'<p class="contact-note">'+esc(booking.note)+'</p>':'')+'</div>':'')+
    (contact.press?'<div class="rv" style="--d:60ms"><h3>'+esc(t('press'))+'</h3>'+mail(contact.press)+'</div>':'')+
    ((contact.socials||[]).length?'<div class="rv" style="--d:120ms"><h3>'+esc(t('socials'))+'</h3><ul>'+contact.socials.map(function(s){return '<li><a href="'+esc(s[1])+'" target="_blank" rel="noopener">'+icon(s[0])+esc(s[0])+'</a></li>'}).join('')+'</ul></div>':'');
  /* newsletter: the email goes to newsletter.endpoint (Formspree, Brevo, Google Sheets...) */

  if(nl&&(nl.endpoint||local)){
    $('news').hidden=false;
    $('news').innerHTML='<div><span class="news-tag"><i aria-hidden="true"></i>'+esc(nl.tag||t('newsTag'))+'</span>'+
      '<h3 id="news-title">'+esc(nl.title||t('newsTitle'))+'</h3>'+(nl.text?'<p class="news-text">'+esc(nl.text)+'</p>':'')+'</div>'+
      '<form class="news-form" id="newsForm" novalidate aria-labelledby="news-title">'+
        '<div class="news-row"><label class="news-hp" for="n-mail">'+esc(t('newsEmail'))+'</label>'+
        '<input id="n-mail" name="email" type="email" autocomplete="email" inputmode="email" placeholder="tu@correo.com" required>'+
        '<button class="pill" type="submit">'+esc(nl.button||t('newsBtn'))+'</button></div>'+
        '<div class="news-hp" aria-hidden="true"><label>'+esc(t('noFill'))+'<input name="_gotcha" tabindex="-1" autocomplete="off"></label></div>'+
        '<label class="news-ok"><input type="checkbox" name="consent" value="si" required><span>'+esc(nl.consent||t('consent',{name:NAME}))+'</span></label>'+
        '<p class="news-status" id="newsStatus" role="status" aria-live="polite"></p>'+
      '</form>';

    root.classList.add('lang-jumped');

<script>
/* focal-point cover + menu */
(function(){
  var hero=(window.SITE||{}).hero||{};
  var stage=document.getElementById('inicio'),img=document.getElementById('photo'),band=document.querySelector('.band');
  var IW=hero.width||0,IH=hero.height||0,F=hero.focus||[IW/2,IH*0.25],FX=F[0],FY=F[1];
  var root=document.documentElement,nav=document.querySelector('.nav'),btn=document.getElementById('menuBtn'),
      links=document.getElementById('navLinks'),label=btn.querySelector('.menu-label');
  function layout(){return getComputedStyle(root).getPropertyValue('--layout').trim()||'desktop';}
  function place(){
    var W=stage.clientWidth,H=stage.clientHeight; if(!W||!H) return;
    var bh=band.getBoundingClientRect().height, compact=layout()!=='desktop';
    stage.style.setProperty('--band-h',bh+'px');
    if(!compact&&nav.classList.contains('is-open')) setMenu(false,false);
    if(!hero.src||!IW||!IH) return;
    /* the focus point (the face) lands just under the band; the letters show what is above it */
    var ty=bh+(compact?0.3:0.36)*(H-bh), tx=W/2;
    var s=Math.max(W/IW,H/IH,ty/FY);
    var l=Math.min(0,Math.max(W-IW*s,tx-FX*s)), t=Math.min(0,Math.max(H-IH*s,ty-FY*s));
    img.style.width=IW*s+'px';img.style.height=IH*s+'px';img.style.left=l+'px';img.style.top=t+'px';
    img.style.setProperty('--fx',(FX/IW*100)+'%');img.style.setProperty('--fy',(FY/IH*100)+'%');
    img.classList.add('is-placed');
  }
  function setMenu(open,moveFocus){
    nav.classList.toggle('is-open',open); btn.setAttribute('aria-expanded',String(open)); label.textContent=open?window.__t('close'):window.__t('menu');
    if(moveFocus!==false){ if(open){var first=links.querySelector('a'); if(first) requestAnimationFrame(function(){first.focus({preventScroll:true})});} else btn.focus(); }
  }
  btn.addEventListener('click',function(){setMenu(!nav.classList.contains('is-open'))});
  links.addEventListener('click',function(e){if(e.target.closest('a')&&layout()!=='desktop')setMenu(false,false)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&nav.classList.contains('is-open'))setMenu(false)});
  document.addEventListener('pointerdown',function(e){if(nav.classList.contains('is-open')&&!nav.contains(e.target))setMenu(false,false)});
  window.__place=place;
  place(); addEventListener('resize',place); if(window.ResizeObserver) new ResizeObserver(place).observe(stage);
  if(document.fonts) document.fonts.ready.then(place);
})();
</script>

<script>
/* entrance: everything rises */
(function(){
  var root=document.documentElement, S=window.SITE||{};
  if(!root.classList.contains('is-entering')) return;
  var EXPO='cubic-bezier(0.16,1,0.3,1)', QUART='cubic-bezier(0.76,0,0.24,1)';
  var img=document.getElementById('photo'), waits=[document.fonts?document.fonts.ready:null];
  if(img.src&&img.decode) waits.push(img.decode().catch(function(){}));
  if(S.logo&&S.logo.src){ var logo=new Image(); logo.src=S.logo.src; if(logo.decode) waits.push(logo.decode().catch(function(){})); }
  Promise.race([Promise.all(waits.filter(Boolean)),new Promise(function(r){setTimeout(r,700)})]).then(function(){
    if(!root.classList.contains('is-entering')) return;
    window.__entrance=true;
    var desk=(getComputedStyle(root).getPropertyValue('--layout').trim()||'desktop')==='desktop';
    var lift=desk?6:4, anims=[];
    function play(el,kf,t,d,e){ if(el) anims.push(el.animate(kf,{delay:t*1000,duration:d*1000,easing:e||EXPO,fill:'both'})); }
    function rise(px){ return [{opacity:0,transform:'translateY('+px+'px)'},{opacity:1,transform:'none'}]; }
    var q=function(s){return document.querySelector(s)};
    [].forEach.call(document.querySelectorAll('.lid'),function(l,i){
      play(l,[{opacity:1,transform:'scaleY(1)'},{opacity:1,transform:'scaleY(0)'}],.06+i*.07,1.0,QUART);
    });
    (desk?[].slice.call(document.querySelectorAll('.nav .col')):[q('.menu-btn')]).forEach(function(el,i){ play(el,rise(lift),.50+i*.06,.6); });
    play(q('.tagline'),rise(lift),.70,.6);
    play(q('.headline'),[{transform:'translateY(100%)',clipPath:'inset(-100% -8px 100% -8px)'},{transform:'none',clipPath:'inset(0 -8px 0 -8px)'}],.85,1.0);
    play(q('.cta'),[{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0 0 0)'}],1.10,.75);
    play(q('.next'),rise(lift+2),1.20,.7);
    play(q('.next-tix'),rise(lift+2),1.30,.7);
    root.classList.remove('is-entering');
    Promise.all(anims.map(function(a){return a.finished})).then(function(){ anims.forEach(function(a){a.cancel()}); },function(){});
  });
})();
</script>

<script>
/* scroll reveals, dock, booking form */
(function(){
  var root=document.documentElement, S=window.SITE||{};

  /* reveals: each block rises once as it enters. Checked by position on every frame of scroll,
     so a fast flick or an anchor jump never leaves skipped blocks hidden above the viewport. */
  if(root.classList.contains('can-reveal')){
    var pending=[].slice.call(document.querySelectorAll('.rv,.rv-img,.rv-head')), ticking=false;
    var check=function(){
      ticking=false; var line=innerHeight*0.88;
      pending=pending.filter(function(el){
        if(el.getBoundingClientRect().top<line){ el.classList.add('is-in'); return false; }
        return true;
      });
      if(!pending.length){ removeEventListener('scroll',onScroll); removeEventListener('resize',onScroll); }
    };
    var onScroll=function(){ if(!ticking){ ticking=true; requestAnimationFrame(check); } };
    addEventListener('scroll',onScroll,{passive:true}); addEventListener('resize',onScroll);
    /* keyboard users never land on something still hidden by its reveal */
    document.addEventListener('focusin',function(e){ for(var el=e.target;el&&el!==document.body;el=el.parentElement){ if(el.matches('.rv,.rv-img,.rv-head')&&!el.classList.contains('is-in')) el.classList.add('is-in','is-now'); } });
    check();
  }

  /* in-page links glide to their section; keyboard focus jumps at once (no smooth scroll on html) */
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href^="#"]'); if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey) return;
    var id=a.getAttribute('href').slice(1), t=id?document.getElementById(id):null; if(!t) return;
    e.preventDefault(); t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
    history.pushState(null,'','#'+id);
  });

  /* dock: appears once the hero has scrolled away, and marks the section in view */
  var dock=document.getElementById('dock'), hero=document.getElementById('inicio');
  dock.inert=true;
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(e){
      var shown=!e[0].isIntersecting; dock.classList.toggle('is-shown',shown); dock.inert=!shown;
    },{rootMargin:'-56px 0px 0px 0px'}).observe(hero);
    var links={}; dock.querySelectorAll('ul a').forEach(function(a){ links[a.getAttribute('href').slice(1)]=a; });
    var spy=new IntersectionObserver(function(entries){
      entries.forEach(function(e){ var a=links[e.target.id]; if(a&&e.isIntersecting){ Object.keys(links).forEach(function(k){links[k].removeAttribute('aria-current')}); a.setAttribute('aria-current','true'); } });
    },{rootMargin:'-45% 0px -50% 0px'});
    Object.keys(links).forEach(function(id){ var s=document.getElementById(id); if(s) spy.observe(s); });
  }

  /* booking: no backend, so the form drafts an email to booking.email */
  var form=document.getElementById('bookingForm'), status=document.getElementById('formStatus');
  if(form) form.addEventListener('submit',function(e){
    e.preventDefault();
    var bad=[].filter.call(form.elements,function(el){return el.willValidate&&!el.checkValidity()});
    if(bad.length){ status.textContent=window.__t('complete')+bad.map(function(el){return form.querySelector('label[for="'+el.id+'"]').textContent.toLowerCase()}).join(', ')+'.'; bad[0].focus(); return; }
    var v=function(n){return form.elements[n].value.trim()};
    var T=window.__t, body=[T('fName')+': '+v('nombre'),T('fMail')+': '+v('correo'),T('fType')+': '+v('tipo'),T('fDate')+': '+v('fecha'),T('fCity')+': '+v('lugar'),'',v('mensaje')].join('\n');
    location.href='mailto:'+((S.booking||{}).email||'')+'?subject='+encodeURIComponent('Booking: '+v('tipo')+', '+v('fecha'))+'&body='+encodeURIComponent(body);
    status.textContent=window.__t('opened');
  });
})();
</script>
